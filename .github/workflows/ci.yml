name: ci
on:
  push:
    branches: [main]
  pull_request:

# The repo is Markdown/LaTeX plus a few helper scripts in tools/.
# No tests yet; this only checks the scripts still parse.
jobs:
  check-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/*.py
