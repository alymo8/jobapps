name: ci
on:
  push:
    branches: [main]
  pull_request:

# The repo is Markdown/LaTeX plus a few helper scripts in tools/.
# Byte-compiles the scripts and runs the stdlib unittest suite in tests/.
jobs:
  check-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf
      - run: python -m py_compile tools/*.py
      - run: python -m unittest discover -s tests -v
