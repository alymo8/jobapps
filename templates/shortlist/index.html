<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Weekly job shortlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a working shortlist — summary strip, then tabbed list of posting rows with filters. */
:root{
  --bg:#f5f7f8; --surface:#ffffff; --ink:#14212b; --muted:#5b6b78; --line:#dbe2e7;
  --accent:#1f5fd1; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --new:#17794a; --new-soft:#dff3e8; --pri:#9a5a00; --pri-soft:#fbefd9;
  --prov:#6b46c1; --prov-soft:#ece6fa; --warn:#b42318; --warn-soft:#fbe4e1;
  --live:#6a7480; --live-soft:#eceff2;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#16202a; --ink:#e6edf2; --muted:#93a3b1; --line:#26333f;
  --accent:#7aa7ff; --accent-ink:#0b1320; --accent-soft:#1b2a44;
  --new:#5fd39a; --new-soft:#123326; --pri:#f0b45a; --pri-soft:#3a2a10;
  --prov:#b79cff; --prov-soft:#2a2145; --warn:#ff8a7a; --warn-soft:#3d1a16;
  --live:#a3adb8; --live-soft:#232d37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#16202a; --ink:#e6edf2; --muted:#93a3b1; --line:#26333f;
  --accent:#7aa7ff; --accent-ink:#0b1320; --accent-soft:#1b2a44;
  --new:#5fd39a; --new-soft:#123326; --pri:#f0b45a; --pri-soft:#3a2a10;
  --prov:#b79cff; --prov-soft:#2a2145; --warn:#ff8a7a; --warn-soft:#3d1a16;
  --live:#a3adb8; --live-soft:#232d37; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0}
.week{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-weight:600;background:none;border:0;color:var(--muted);padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .n{font-family:var(--f-mono);font-weight:400;font-size:12px;margin-left:6px;color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 240px;min-width:0}
.tog{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.tog[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 16px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rk{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.main{min-width:0;display:grid;gap:4px}
.co{font-weight:600}
.ti{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.ti a{color:inherit;text-decoration:none}
.ti a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.meta{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.note{font-size:14px;max-width:80ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-content:start;max-width:260px}
.chip{font-size:12px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap;letter-spacing:.01em}
.c-new{background:var(--new-soft);color:var(--new)}.c-pri{background:var(--pri-soft);color:var(--pri)}
.c-prov{background:var(--prov-soft);color:var(--prov)}.c-unv{background:var(--warn-soft);color:var(--warn)}
.c-live{background:var(--live-soft);color:var(--live)}.c-dl{background:var(--warn-soft);color:var(--warn)}
.c-mode{background:var(--accent-soft);color:var(--accent)}
.score{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:640px){.row{grid-template-columns:40px minmax(0,1fr)}.chips{grid-column:2;justify-content:flex-start;max-width:none}}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0;white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.flagsec{display:grid;gap:8px}
.flagsec h3{font-family:var(--f-display);font-size:18px;margin:8px 0 0}
.fi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;min-width:0;overflow-wrap:anywhere}
.fi .d{color:var(--muted);font-size:13.5px}
.md{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 20px 20px;max-width:900px}
.md h2{font-family:var(--f-display);font-size:20px;margin:22px 0 6px}.md h1{font-size:24px;margin-top:14px}
.md li{margin:3px 0}.md p{max-width:75ch}
a{color:var(--accent)}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.src{color:var(--muted);font-size:12.5px}
.src code{font-family:var(--f-mono)}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}.row:hover{background:var(--bg)}}

.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.act{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 9px;cursor:pointer}
.act:hover{border-color:var(--accent)}
.act.ap{color:var(--new);border-color:color-mix(in srgb,var(--new) 40%,var(--line))}
.act.ni{color:var(--muted)}
.act[disabled]{opacity:.5;cursor:default}
.c-ap{background:var(--new-soft);color:var(--new)}.c-ni{background:var(--live-soft);color:var(--live)}
.row.decided{opacity:.62}
.side{display:grid;gap:8px;justify-items:end;align-content:start;max-width:280px}
@media (max-width:640px){.side{grid-column:2;justify-items:start;max-width:none}.acts{justify-content:flex-start}}
.banner{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Weekly job shortlist</h1>
      <p class="sub" id="sub">Loading this week's list…</p>
    </div>
    <label class="week" for="weekSel">Week <select id="weekSel"></select></label>
  </header>
  <section class="stats" id="stats" aria-label="This week in numbers"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <p class="banner" id="dbnote" hidden></p>
  <section id="panel"></section>
  <p class="src">Data files for tools: <code>data/index.json</code>, <code>data/latest.json</code>, <code>data/&lt;week&gt;.json</code>, <code>data/&lt;week&gt;.csv</code>. Applied and not-interested marks live in the artifact database, collection <code>decisions</code>.</p>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TABS=[["ranked","Ranked"],["below","Below the cut"],["decisions","My decisions"],["coverage","Priority coverage"],["flags","Flags"],["summary","Summary"]];
let doc=null, tab=(location.hash||"").slice(1)||store.get("tab","ranked");
if(!TABS.some(t=>t[0]===tab)) tab="ranked";
const f=Object.assign({q:"",newOnly:false,pri:false,remote:false,hideLive:false,showDecided:false},store.get("filters",{}));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- Decision keys: must match the Python reference in the weekly-run prompt ---- */
function normUrl(u){
  u=String(u||"").trim();
  try{const x=new URL(u);let host=x.hostname.toLowerCase().replace(/^www\./,"");let p=x.pathname;if(p.length>1)p=p.replace(/\/+$/,"");return host+p+x.search}
  catch(e){return u.toLowerCase()}
}
function normText(s){return String(s||"").replace(/\([^)]*\)/g," ").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
const CO_SUFFIX=new Set(["inc","ltd","llc","corp","corporation","canada","group","co","the"]);
function normCompany(s){const t=normText(s).split(" ").filter(Boolean);while(t.length>1&&CO_SUFFIX.has(t[t.length-1]))t.pop();return t.join(" ")}
const matchKey=r=>normCompany(r.company)+"|"+normText(r.title);
async function docId(url){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(normUrl(url)));
  return "u-"+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,24);
}

/* ---- Decisions store ---- */
let db=null, canWrite=false, decisions=new Map(), byKey=new Map(), rowIds=new Map(), busy=new Set();
function indexDecisions(docs){
  decisions=new Map(); byKey=new Map();
  for(const d of docs){const v=d.data();if(!v)continue;decisions.set(d.id,v);if(v.match_key)byKey.set(v.match_key,v)}
}
function decisionFor(r){const id=rowIds.get(r.url);return (id&&decisions.get(id))||byKey.get(matchKey(r))||null}
async function initDb(){
  const note=$("#dbnote");
  try{db=await claude.use("db")}catch(e){db=null}
  if(!db){note.hidden=false;note.textContent="Marking postings as Applied or Not interested needs you to be signed in to claude.ai. The list itself works without it.";render();return}
  let user=null;try{user=await claude.use("user")}catch(e){}
  const w=user?user.can("data.write"):null; canWrite=w!==false;
  db.collection("decisions").onSnapshot(s=>{indexDecisions(s.docs);renderTabs();render()},()=>{note.hidden=false;note.textContent="Your decisions could not be loaded right now. Reload the page to try again."});
}
async function decide(r,decision){
  if(!db||busy.has(r.url))return;
  busy.add(r.url);render();
  try{
    const id=rowIds.get(r.url)||await docId(r.url);
    await db.doc("decisions/"+id).set({schema_version:1,url:r.url,url_norm:normUrl(r.url),company:r.company,title:r.title,
      match_key:matchKey(r),decision,source:"user",decided_at:new Date().toISOString(),week_seen:doc.week,note:""});
  }catch(e){const n=$("#dbnote");n.hidden=false;n.textContent=e&&e.code==="invalid_argument"?"You can view this list but not change it, so your mark was not saved.":"That mark was not saved. Check your connection and try again."}
  busy.delete(r.url);render();
}
async function undo(id){
  if(!db)return;busy.add(id);render();
  try{await db.doc("decisions/"+id).delete()}catch(e){const n=$("#dbnote");n.hidden=false;n.textContent="Undo was not saved. Try again."}
  busy.delete(id);render();
}

/* ---- Data ---- */
async function loadIndex(){
  const idx=await (await fetch("data/index.json")).json();
  const sel=$("#weekSel");
  sel.innerHTML=idx.weeks.filter(w=>w.json).map(w=>`<option value="${esc(w.json)}">${esc(w.week)}</option>`).join("");
  sel.onchange=()=>loadWeek(sel.value);
  await loadWeek(sel.value||"data/latest.json");
}
async function loadWeek(path){
  doc=await (await fetch(path)).json();
  const c=doc.counts;
  $("#sub").textContent=doc.week?`Week of ${doc.week} · compared with ${doc.baseline_compared||"no earlier week"}`:"No list yet: the first weekly run fills this page.";
  $("#stats").innerHTML=[["Qualifying",c.total],["New this week",c.new],["New in top 100",c.new_in_ranked],["Priority companies",c.priority],["Region-restricted",c.region_restricted??c.province_restricted],["Likely live",c.likely_live]]
    .map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  renderTabs(); render();
  for(const r of doc.rows){ if(!rowIds.has(r.url)) rowIds.set(r.url,await docId(r.url)); }
  render();
}

/* ---- Views ---- */
function renderTabs(){
  const n={ranked:doc.counts.ranked,below:doc.counts.below_cut,decisions:decisions.size,coverage:doc.coverage.length,flags:doc.flags.reduce((a,s)=>a+s.items.length,0)};
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" id="t-${k}" aria-selected="${k===tab}" data-k="${k}">${l}${n[k]!=null?`<span class="n">${n[k]}</span>`:""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;store.set("tab",tab);renderTabs();render()});
}
const dlabel=d=>d.decision==="applied"?"Applied":"Not interested";
const ddate=d=>String(d.decided_at||"").slice(0,10);
function chips(r,d){
  const o=[];
  if(d)o.push(`<span class="chip ${d.decision==="applied"?"c-ap":"c-ni"}">${dlabel(d)} ${esc(ddate(d))}</span>`);
  if(r.new==="Yes")o.push('<span class="chip c-new">New</span>');
  if(r.priority==="Yes")o.push('<span class="chip c-pri">Priority</span>');
  const elig=r.eligibility??r.canada??"";
  if(/restricted/.test(elig))o.push('<span class="chip c-prov">Region-restricted</span>');
  if(elig==="Unverified")o.push('<span class="chip c-unv">Location unverified</span>');
  if(r.status==="Likely live")o.push('<span class="chip c-live">Likely live</span>');
  if(r.deadline)o.push(`<span class="chip c-dl">Closes ${esc(r.deadline)}</span>`);
  o.push(`<span class="chip c-mode">${esc(r.work_mode)}</span>`);
  return o.join("");
}
function actions(r,d){
  if(!db||!canWrite)return "";
  const dis=busy.has(r.url)?" disabled":"";
  if(d){const id=[...decisions.entries()].find(([k,v])=>v===d)?.[0];return id?`<div class="acts"><button class="act" data-undo="${esc(id)}"${busy.has(id)?" disabled":""}>Undo</button></div>`:""}
  return `<div class="acts"><button class="act ap" data-url="${esc(r.url)}" data-d="applied"${dis}>Applied</button><button class="act ni" data-url="${esc(r.url)}" data-d="not_interested"${dis}>Not interested</button></div>`;
}
function listView(which){
  const rows=doc.rows.filter(r=>r.tab===which);
  const q=f.q.trim().toLowerCase();
  let hidden=0;
  const out=rows.filter(r=>{
    const d=decisionFor(r); if(d&&!f.showDecided){hidden++;return false}
    return (!q||(r.company+" "+r.title+" "+r.location+" "+r.fit_notes).toLowerCase().includes(q))
    &&(!f.newOnly||r.new==="Yes")&&(!f.pri||r.priority==="Yes")&&(!f.remote||r.work_mode==="Remote")&&(!f.hideLive||r.status!=="Likely live")});
  const tg=(k,l)=>`<button class="tog" id="f-${k}" aria-pressed="${f[k]}" data-k="${k}">${l}</button>`;
  return `<div class="filters"><input type="search" id="q" placeholder="Search company, title, city, stack…" value="${esc(f.q)}" aria-label="Search postings">
    ${tg("newOnly","New only")}${tg("pri","Priority only")}${tg("remote","Remote")}${tg("hideLive","Hide likely live")}${tg("showDecided","Show decided")}
    <span class="count">${out.length} of ${rows.length}${hidden?` · ${hidden} decided hidden`:""}</span></div>
    <div class="list">${out.length?out.map(r=>{const d=decisionFor(r);return `<article class="row${d?" decided":""}"><div class="rk">${r.rank}</div>
      <div class="main"><div class="co">${esc(r.company)} <span class="score">· ${esc(r.company_type)} · score ${r.score}</span></div>
      <div class="ti">${/^https?:/.test(r.url||"")?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</div>
      <div class="meta">${esc(r.location)}</div><div class="note">${esc(r.fit_notes)}</div></div>
      <div class="side"><div class="chips">${chips(r,d)}</div>${actions(r,d)}</div></article>`}).join(""):'<div class="empty">No postings match these filters.</div>'}</div>`;
}
function decisionsView(){
  if(!db)return '<div class="empty">Sign in to claude.ai to see and change your decisions.</div>';
  const all=[...decisions.entries()].sort((a,b)=>String(b[1].decided_at).localeCompare(String(a[1].decided_at)));
  if(!all.length)return '<div class="empty">No decisions yet. Mark a posting as Applied or Not interested on the Ranked or Below the cut tab, or let Claude Code record the ones you apply to. Marked postings stop appearing in next week\'s list.</div>';
  const src={user:"You (page)",claude_code:"Claude Code",user_manual:"You (manual)"};
  return `<div class="tablewrap"><table><thead><tr><th>Decision</th><th>Date</th><th>Company</th><th>Title</th><th>Recorded by</th><th>Note</th><th></th></tr></thead><tbody>${
    all.map(([id,d])=>`<tr><td><span class="chip ${d.decision==="applied"?"c-ap":"c-ni"}">${dlabel(d)}</span></td><td class="num">${esc(ddate(d))}</td><td><b>${esc(d.company)}</b></td><td>${d.url&&/^https?:/.test(d.url)?`<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a>`:esc(d.title)}</td><td>${esc(src[d.source]||d.source||"")}</td><td>${esc(d.note||"")}</td><td>${canWrite?`<button class="act" data-undo="${esc(id)}"${busy.has(id)?" disabled":""}>Undo</button>`:""}</td></tr>`).join("")}</tbody></table></div>`;
}
function coverageView(){
  return `<div class="tablewrap"><table><thead><tr><th>Company</th><th>Result</th><th>Qualifying</th><th>Board checked</th><th>Notes</th></tr></thead><tbody>${
    doc.coverage.map(c=>`<tr><td><b>${esc(c.company)}</b></td><td>${esc(c.result)}</td><td class="num">${c.qualifying_count}</td><td>${c.board&&/^https?:/.test(c.board)?`<a href="${esc(c.board)}" target="_blank" rel="noopener">board</a>`:esc(c.board)}</td><td style="min-width:280px">${esc(c.notes)}</td></tr>`).join("")}</tbody></table></div>`;
}
function flagsView(){
  return doc.flags.map(s=>`<div class="flagsec"><h3>${esc(s.section)} <span class="score">${s.items.length}</span></h3>${
    s.items.map(i=>`<div class="fi"><div><b>${esc(i.company)}</b>${i.item?(i.company?" · ":"")+esc(i.item):""}</div>${(i.location_or_status||i.detail)?`<div class="d">${esc([i.location_or_status,i.detail].filter(Boolean).join(" · "))}</div>`:""}${i.url?`<div class="d">${/^https?:/.test(i.url)?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.url)}</a>`:esc(i.url)}</div>`:""}</div>`).join("")}</div>`).join("");
}
function md(s){
  const lines=esc(s).split("\n");let h="",inL=0;
  const il=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  for(const ln of lines){
    const m=ln.match(/^(\s*)- (.*)/);
    if(m){const d=m[1].length?2:1;while(inL<d){h+="<ul>";inL++}while(inL>d){h+="</ul>";inL--}h+=`<li>${il(m[2])}</li>`;continue}
    while(inL){h+="</ul>";inL--}
    if(/^## /.test(ln))h+=`<h2>${il(ln.slice(3))}</h2>`;else if(/^# /.test(ln))h+=`<h1>${il(ln.slice(2))}</h1>`;else if(ln.trim())h+=`<p>${il(ln)}</p>`;
  }
  while(inL){h+="</ul>";inL--}return h;
}
function render(){
  if(!doc)return;
  const p=$("#panel");
  if(tab==="ranked"||tab==="below"){
    p.innerHTML=listView(tab==="ranked"?"main":"below_cut");
    const q=$("#q");q.oninput=()=>{f.q=q.value;store.set("filters",f);const pos=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
    p.querySelectorAll(".tog").forEach(b=>b.onclick=()=>{f[b.dataset.k]=!f[b.dataset.k];store.set("filters",f);render()});
  } else if(tab==="decisions") p.innerHTML=decisionsView();
  else if(tab==="coverage") p.innerHTML=coverageView();
  else if(tab==="flags") p.innerHTML=flagsView();
  else p.innerHTML=`<div class="md">${md(doc.summary_md)}</div>`;
  p.querySelectorAll("button[data-d]").forEach(b=>b.onclick=()=>{const r=doc.rows.find(x=>x.url===b.dataset.url);if(r)decide(r,b.dataset.d)});
  p.querySelectorAll("button[data-undo]").forEach(b=>b.onclick=()=>undo(b.dataset.undo));
}
loadIndex().then(initDb).catch(()=>{$("#sub").textContent="The list's data files could not be loaded. Reload the page to try again."});
})();
</script>
